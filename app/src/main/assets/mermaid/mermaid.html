<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; padding: 16px; background: #FFFFFF; font-family: -apple-system, sans-serif; }
  #diagram { display: inline-block; }
  svg { max-width: 100% !important; height: auto !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  try {
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  } catch(e) {}

  function renderDiagram(code) {
    try {
      var container = document.getElementById('diagram');
      container.innerHTML = code;
      mermaid.render('theSvg', code).then(function(res) {
        container.innerHTML = res.svg;
        if (window.AndroidBridge) {
          window.AndroidBridge.onRenderFinished(true);
        }
      }).catch(function(err) {
        container.innerHTML = '<pre style="color:#E53935;font-size:12px;">' + err + '</pre>';
        if (window.AndroidBridge) {
          window.AndroidBridge.onRenderFinished(false);
        }
      });
    } catch (err) {
      if (window.AndroidBridge) {
        window.AndroidBridge.onRenderFinished(false);
      }
    }
  }
</script>
</head>
<body>
  <div id="diagram"></div>
</body>
</html>
